name: Checkmarx Scan

on:
  workflow_dispatch:      # manual "Run workflow" button, any branch
  push:                   # any branch
  pull_request:           # PRs into any branch
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read          # for actions/checkout
      security-events: write  # for upload-sarif
      actions: read           # only required for private repos by upload-sarif

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkmarx One scan
        uses: checkmarx/ast-github-action@main
        with:
          base_uri: https://ind.ast.checkmarx.net/
          cx_tenant: cx_ind_internal_test
          cx_client_id: Test_Saurabh_New
          cx_client_secret: FqGxmjkoTVLcWQx7nwUWkRwDDtKHR4y91vSq7TiZrVQJnUJzyjmTLNraPDLsGk3IhY59879q86dcOPw9gpC6iu
          project_name: Saurabh-scale-sec-vulnado-github-action-scan
          branch: ${{ github.head_ref || github.ref_name }}
          additional_params: --report-format sarif --output-name cx_result --output-path .

      - name: Fix SARIF levels
        if: always()
        run: |
          if [ -f cx_result.sarif ]; then
            jq '(.runs[].results[]? | select(.level != null) | .level) |= (if . == "none" or . == "note" or . == "warning" or . == "error" then . else "warning" end)' cx_result.sarif > cx_fixed.sarif
            mv cx_fixed.sarif cx_result.sarif
          fi

      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: cx_result.sarif
